services:
  api:
    build:
      context: ./api_football_predictor
    image: football-predictor-api
    container_name: football_predictor_api
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      API_SERVER_PORT: ${API_SERVER_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_SERVER_PORT:-8000}"

  front:
    build:
      context: ./front
    image: football-predictor-front
    container_name: football_predictor_front
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:${API_SERVER_PORT:-8000}}
      FRONT_SERVER_PORT: ${FRONT_SERVER_PORT:-8501}
    ports:
      - "${FRONT_PORT:-8501}:${FRONT_SERVER_PORT:-8501}"
    depends_on:
      - api
